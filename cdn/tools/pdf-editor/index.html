        async function rotatePageItem(file) {
            file.rotation = ((file.rotation || 0) + 90) % 360;

            const rotatedOriginalUrl = await new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.naturalHeight;
                    canvas.height = img.naturalWidth;
                    const ctx = canvas.getContext('2d');
                    ctx.translate(canvas.width / 2, canvas.height / 2);
                    ctx.rotate(Math.PI / 2);
                    ctx.drawImage(img, -img.naturalWidth / 2, -img.naturalHeight / 2);
                    canvas.toBlob((blob) => {
                        resolve(blob ? URL.createObjectURL(blob) : canvas.toDataURL('image/jpeg', 0.92));
                    }, 'image/jpeg', 0.92);
                };
                img.src = file.originalDataUrl;
            });

            if (file.originalDataUrl && file.originalDataUrl.startsWith('blob:')) {
                if (file.dataUrl === file.originalDataUrl) {
                    file.dataUrl = null;
                }
                URL.revokeObjectURL(file.originalDataUrl);
            }
            file.originalDataUrl = rotatedOriginalUrl;

            await rebuildSinglePageComposite(file);
        }

        // --- RENDER COMPOSITE (GỐC + NOTE + WATERMARK PATTERN/SINGLE + PAGE NUM) ---
        function drawOverlaysOnCanvas(ctx, w, h, file, seqIndex, totalChecked) {
            // 1. Vẽ Note của trang
            if (file.annotations && file.annotations.length > 0) {
                file.annotations.forEach(ann => {
                    if (ann.type === 'note') {
                        ctx.save();
                        const fontSize = Math.max(12, Math.round(Math.min(w, h) * 0.022));
                        ctx.font = `600 ${fontSize}px Montserrat, sans-serif`;
                        const boxW = Math.round(w * 0.34);
                        const pad = Math.round(fontSize * 0.8);
                        const words = String(ann.text).split(/\s+/);
                        const lines = [];
                        let curLine = '';
                        words.forEach(word => {
                            const test = curLine ? curLine + ' ' + word : word;
                            if (ctx.measureText(test).width > boxW - pad * 2) {
                                if (curLine) lines.push(curLine);
                                curLine = word;
                            } else {
                                curLine = test;
                            }
                        });
                        if (curLine) lines.push(curLine);

                        const headerH = Math.round(fontSize * 1.6);
                        const boxH = headerH + lines.length * Math.round(fontSize * 1.35) + pad * 1.5;
                        const margin = Math.round(Math.min(w, h) * 0.035);

                        let bx = w - boxW - margin;
                        let by = margin;
                        if (ann.position === 'top-left') { bx = margin; by = margin; }
                        if (ann.position === 'bottom-right') { bx = w - boxW - margin; by = h - boxH - margin; }
                        if (ann.position === 'bottom-left') { bx = margin; by = h - boxH - margin; }

                        ctx.fillStyle = 'rgba(216, 210, 186, 0.94)';
                        ctx.fillRect(bx, by, boxW, boxH);
                        ctx.strokeStyle = '#4b4340';
                        ctx.lineWidth = Math.max(2, Math.round(Math.min(w, h) * 0.003));
                        ctx.strokeRect(bx, by, boxW, boxH);

                        ctx.fillStyle = '#4b4340';
                        ctx.fillRect(bx, by, boxW, headerH);
                        ctx.fillStyle = '#d3cebb';
                        ctx.font = `700 ${Math.round(fontSize * 0.85)}px Montserrat, sans-serif`;
                        ctx.textAlign = 'left';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('NOTE', bx + pad * 0.7, by + headerH / 2);

                        ctx.fillStyle = '#4b4340';
                        ctx.font = `600 ${fontSize}px Montserrat, sans-serif`;
                        lines.forEach((ln, i) => {
                            ctx.fillText(ln, bx + pad * 0.7, by + headerH + pad * 0.8 + i * Math.round(fontSize * 1.35));
                        });
                        ctx.restore();
                    }
                });
            }

            // 2. Vẽ Watermark (Single hoặc Pattern lặp đều cùng hướng)
            if (watermarkConfig.enabled && watermarkConfig.text) {
                ctx.save();
                ctx.beginPath();
                ctx.rect(0, 0, w, h);
                ctx.clip();

                ctx.globalAlpha = watermarkConfig.opacity;
                ctx.fillStyle = watermarkConfig.color;
                const wmFontSize = Math.round(Math.min(w, h) * watermarkConfig.sizeRatio);
                ctx.font = `700 ${wmFontSize}px Montserrat, sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.translate(w / 2, h / 2);
                if (watermarkConfig.style === 'diagonal') {
                    ctx.rotate(-Math.PI / 4);
                }

                if (!watermarkConfig.isPattern) {
                    ctx.fillText(watermarkConfig.text, 0, 0);
                } else {
                    const textMetrics = ctx.measureText(watermarkConfig.text);
                    const textW = Math.max(textMetrics.width, wmFontSize * 2);
                    const minDim = Math.min(w, h);
                    const gap = minDim * ((watermarkConfig.spacing || 24) / 100);
                    const stepX = textW + gap * 1.3;
                    const stepY = wmFontSize * 1.4 + gap;
                    const diag = Math.hypot(w, h);

                    const countX = Math.ceil(diag / stepX) + 1;
                    const countY = Math.ceil(diag / stepY) + 1;

                    for (let row = -countY; row <= countY; row++) {
                        const y = row * stepY;
                        const rowOffset = (Math.abs(row) % 2 === 1) ? (stepX / 2) : 0;
                        for (let col = -countX; col <= countX; col++) {
                            const x = col * stepX + rowOffset;
                            ctx.fillText(watermarkConfig.text, x, y);
                        }
                    }
                }
                ctx.restore();
            }

            // 3. Vẽ Số trang tự động (Đa màu sắc & Opacity)
            if (pageNumberConfig.enabled && seqIndex !== -1 && totalChecked > 0) {
                ctx.save();
                ctx.globalAlpha = pageNumberConfig.opacity ?? 0.90;
                const numFontSize = Math.max(12, Math.round(Math.min(w, h) * 0.022));
                ctx.font = `700 ${numFontSize}px Montserrat, sans-serif`;
                ctx.fillStyle = pageNumberConfig.color || '#4b4340';
                const margin = Math.round(Math.min(w, h) * 0.035);
                const pageNum = seqIndex + 1;
                let label = `${pageNum} / ${totalChecked}`;
                if (pageNumberConfig.format === 'page') label = `Page ${pageNum} of ${totalChecked}`;
                if (pageNumberConfig.format === 'dash') label = `- ${pageNum} -`;

                let nx = w / 2, ny = h - margin;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';

                if (pageNumberConfig.position === 'bottom-right') {
                    nx = w - margin;
                    ctx.textAlign = 'right';
                } else if (pageNumberConfig.position === 'bottom-left') {
                    nx = margin;
                    ctx.textAlign = 'left';
                } else if (pageNumberConfig.position === 'top-right') {
                    nx = w - margin;
                    ny = margin + numFontSize;
                    ctx.textAlign = 'right';
                } else if (pageNumberConfig.position === 'top-center') {
                    nx = w / 2;
                    ny = margin + numFontSize;
                    ctx.textAlign = 'center';
                }
                ctx.fillText(label, nx, ny);
                ctx.restore();
            }
        }

        function hasAnyOverlay(file) {
            return (file.annotations && file.annotations.length > 0) || watermarkConfig.enabled || pageNumberConfig.enabled;
        }

        async function rebuildSinglePageComposite(file) {
            const checkedSeq = getCheckedSequence();
            const seqIdx = checkedSeq.findIndex(item => item.id === file.id);

            if (!hasAnyOverlay(file)) {
                if (file.dataUrl && file.dataUrl !== file.originalDataUrl && file.dataUrl.startsWith('blob:')) {
                    URL.revokeObjectURL(file.dataUrl);
                }
                file.dataUrl = file.originalDataUrl;
            } else {
                const newUrl = await new Promise((resolve) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = img.naturalWidth;
                        canvas.height = img.naturalHeight;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0);
                        drawOverlaysOnCanvas(ctx, canvas.width, canvas.height, file, seqIdx, checkedSeq.length);
                        canvas.toBlob((blob) => {
                            resolve(blob ? URL.createObjectURL(blob) : canvas.toDataURL('image/jpeg', 0.92));
                        }, 'image/jpeg', 0.92);
                    };
                    img.src = file.originalDataUrl;
                });

                if (file.dataUrl && file.dataUrl !== file.originalDataUrl && file.dataUrl.startsWith('blob:')) {
                    URL.revokeObjectURL(file.dataUrl);
                }
                file.dataUrl = newUrl;
            }

            const thumbImg = document.querySelector(`.thumb-wrapper[data-id="${file.id}"] .thumb-box img`);
            if (thumbImg) thumbImg.src = file.dataUrl;

            if (currentPreviewId === file.id) {
                selectPageForPreview(file);
            }
        }

        async function refreshAllPagesComposited() {
            const currentSeq = getCurrentSequence();
            for (let i = 0; i < currentSeq.length; i++) {
                await rebuildSinglePageComposite(currentSeq[i]);
            }
        }

        function renderThumbnails(filesToRender, insertBeforeEl = null) {
            const grid = document.getElementById('thumbGrid');
            if(grid.innerHTML.includes("No images")) grid.innerHTML = '';
            
            const fragment = document.createDocumentFragment();

            filesToRender.forEach(file => {
                let displayName = file.name;
                if(displayName.length > 56) displayName = displayName.substring(0, 53) + '...';

                const wrapper = document.createElement('div');
                wrapper.className = 'thumb-wrapper'; wrapper.dataset.id = file.id;

                wrapper.innerHTML = `
                    <div class="thumb-box">
                        <input type="checkbox" class="thumb-checkbox" checked>
                        <div class="thumb-delete" title="Remove"><i class="fas fa-times"></i></div>
                        <div class="thumb-rotate" title="Rotate 90°"><i class="fas fa-redo-alt"></i></div>
                        <img src="${file.dataUrl}">
                    </div>
                    <div class="thumb-name" title="${file.name}">${displayName}</div>
                `;

                wrapper.querySelector('.thumb-checkbox').addEventListener('click', async (e) => { 
                    e.stopPropagation();
                    file.checked = e.target.checked;
                    clickSound.currentTime = 0; clickSound.play();
                    if (pageNumberConfig.enabled) {
                        await refreshAllPagesComposited();
                    }
                    updateToolbarStatus();
                });

                wrapper.querySelector('.thumb-rotate').addEventListener('click', async (e) => {
                    e.stopPropagation();
                    clickSound.currentTime = 0; clickSound.play();
                    await rotatePageItem(file);
                });

                wrapper.querySelector('.thumb-delete').addEventListener('click', (e) => {
                    e.stopPropagation(); deleteSound.currentTime = 0; deleteSound.play(); 
                    wrapper.classList.add('removing');
                    setTimeout(async () => { 
                        wrapper.remove();
                        revokeItemUrls(file);
                        uploadedFiles = uploadedFiles.filter(f => f.id !== file.id);
                        cleanupUnusedPdfBuffer(file.pdfId);
                        resetPreviewIfDeleted(file.id);
                        if (pageNumberConfig.enabled) {
                            await refreshAllPagesComposited();
                        }
                        updateToolbarStatus();
                    }, 5);
                });

                wrapper.querySelector('.thumb-box').addEventListener('click', (e) => {
                    if (
                        e.target.closest('.thumb-delete') ||
                        e.target.closest('.thumb-rotate') ||
                        e.target.classList.contains('thumb-checkbox')
                    ) return;
                    clickSound.currentTime = 0; clickSound.play();
                    selectPageForPreview(file);
                });
                fragment.appendChild(wrapper);
            });

            if (insertBeforeEl && insertBeforeEl.parentNode === grid) {
                grid.insertBefore(fragment, insertBeforeEl);
            } else {
                grid.appendChild(fragment);
            }
        }

        function getCurrentSequence() {
            const currentUI = [];
            document.querySelectorAll('.thumb-wrapper').forEach(el => {
                const fileObj = uploadedFiles.find(f => f.id === el.dataset.id);
                if (fileObj && !el.classList.contains('removing')) currentUI.push(fileObj);
            });
            return currentUI;
        }

        function getCheckedSequence() {
            return getCurrentSequence().filter(f => document.querySelector(`.thumb-wrapper[data-id="${f.id}"] .thumb-checkbox`)?.checked);
        }

        // 5. EXTRACT TEXT (NO OCR - PDF.JS CONTENT STREAM PARSING)
        async function extractTextFromSelectedPages(sequenceOverride = null) {
            const sequence = sequenceOverride || getCheckedSequence();
            const pdfItems = sequence.filter(item => item.type === 'pdf-page' && pdfBuffersMap.has(item.pdfId));
            if (pdfItems.length === 0) return '';

            const loadedPdfDocs = new Map();
            let fullText = '';

            for (let i = 0; i < pdfItems.length; i++) {
                const item = pdfItems[i];
                let pdfDoc = loadedPdfDocs.get(item.pdfId);
                if (!pdfDoc) {
                    const buf = pdfBuffersMap.get(item.pdfId).slice(0);
                    const savedPwd = pdfPasswordsMap.get(item.pdfId);
                    const docParams = { data: new Uint8Array(buf) };
                    if (savedPwd) docParams.password = savedPwd;
                    pdfDoc = await pdfjsLib.getDocument(docParams).promise;
                    loadedPdfDocs.set(item.pdfId, pdfDoc);
                }

                const page = await pdfDoc.getPage(item.pageNumber);
                const textContent = await page.getTextContent();
                let lastY = null;
                let pageText = '';

                for (const tItem of textContent.items) {
                    const curY = tItem.transform ? tItem.transform[5] : null;
                    if (lastY !== null && curY !== null && Math.abs(curY - lastY) > 5) {
                        pageText += '\n';
                    } else if (pageText.length > 0 && !pageText.endsWith(' ') && !pageText.endsWith('\n')) {
                        pageText += ' ';
                    }
                    pageText += tItem.str;
                    if (curY !== null) lastY = curY;
                }

                fullText += `=== [${item.name}] ===\n${pageText.trim() || '(No embedded vector text on this page)'}\n\n`;
            }

            return fullText.trim();
        }

        // --- HỆ THỐNG EXPORT, ƯỚC TÍNH DUNG LƯỢNG FILE & BẢO MẬT MẬT KHẨU ---
        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
        }

        function imageToBytes(dataUrl, mimeType = 'image/jpeg', quality = 0.95) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.naturalWidth;
                    canvas.height = img.naturalHeight;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0);
                    canvas.toBlob(async (blob) => {
                        if (!blob) return reject(new Error('Canvas toBlob failed'));
                        const buffer = await blob.arrayBuffer();
                        resolve({
                            blob: blob,
                            bytes: buffer,
                            width: img.naturalWidth,
                            height: img.naturalHeight
                        });
                    }, mimeType, quality);
                };
                img.onerror = reject;
                img.src = dataUrl;
            });
        }

        function createTransparentOverlayPng(w, h, item, seqIdx, totalChecked) {
            return new Promise((resolve) => {
                const canvas = document.createElement('canvas');
                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext('2d');
                drawOverlaysOnCanvas(ctx, w, h, item, seqIdx, totalChecked);
                canvas.toBlob(async (blob) => {
                    if (!blob) return resolve(null);
                    resolve(await blob.arrayBuffer());
                }, 'image/png');
            });
        }

        async function addImagePageToPdfLib(outPdf, dataUrl, quality = 0.95) {
            const { bytes, width: imgW, height: imgH } = await imageToBytes(dataUrl, 'image/jpeg', quality);
            const embeddedImg = await outPdf.embedJpg(bytes);

            const isLandscape = imgW > imgH;
            const a4W = isLandscape ? 841.89 : 595.28;
            const a4H = isLandscape ? 595.28 : 841.89;

            const ratio = imgW / imgH;
            let drawW = a4W;
            let drawH = a4W / ratio;
            if (drawH > a4H) {
                drawH = a4H;
                drawW = a4H * ratio;
            }

            const page = outPdf.addPage([a4W, a4H]);
            page.drawImage(embeddedImg, {
                x: (a4W - drawW) / 2,
                y: (a4H - drawH) / 2,
                width: drawW,
                height: drawH
            });
        }

        // Hàm biên dịch gói xuất (dùng chung cho cả tính toán Estimated File Size và khi bấm Export Now)
        async function buildExportPackage(sequence, baseFileName, format, quality, password, onProgress = null) {
            let blobResult = null;
            let extResult = '.pdf';

            if (format === 'txt') {
                if (onProgress) onProgress(50, 'EXTRACTING TEXT...');
                const txt = await extractTextFromSelectedPages(sequence);
                blobResult = new Blob([txt || 'No embedded vector text found in the selected pages.'], { type: 'text/plain;charset=utf-8' });
                extResult = '.txt';
                if (onProgress) onProgress(100, 'PROCESSING 100%');
            } else if (format === 'jpg' || format === 'png') {
                const mime = format === 'png' ? 'image/png' : 'image/jpeg';
                const ext = format === 'png' ? 'png' : 'jpg';

                if (sequence.length === 1) {
                    const { blob } = await imageToBytes(sequence[0].dataUrl, mime, quality);
                    blobResult = blob;
                    extResult = '.' + ext;
                    if (onProgress) onProgress(100, 'PROCESSING 100%');
                } else {
                    const zip = new JSZip();
                    for (let i = 0; i < sequence.length; i++) {
                        const { blob } = await imageToBytes(sequence[i].dataUrl, mime, quality);
                        const pageNumStr = String(i + 1).padStart(2, '0');
                        zip.file(`${baseFileName}_Page_${pageNumStr}.${ext}`, blob);
                        const pct = Math.round(((i + 1) / sequence.length) * 100);
                        if (onProgress) onProgress(pct, `PACKAGING ${pct}%`);
                    }
                    blobResult = await zip.generateAsync({ type: 'blob' });
                    extResult = '.zip';
                }
            } else {
                const useEncryptedJsPdf = Boolean(password);

                if (!useEncryptedJsPdf && window.PDFLib) {
                    const { PDFDocument, degrees } = window.PDFLib;
                    const outPdf = await PDFDocument.create();
                    const loadedSrcDocs = new Map();

                    for (let i = 0; i < sequence.length; i++) {
                        const item = sequence[i];

                        if (item.type === 'pdf-page' && pdfBuffersMap.has(item.pdfId) && !pdfPasswordsMap.has(item.pdfId) && quality >= 0.9) {
                            try {
                                let srcDoc = loadedSrcDocs.get(item.pdfId);
                                if (!srcDoc) {
                                    const rawBuffer = pdfBuffersMap.get(item.pdfId);
                                    srcDoc = await PDFDocument.load(rawBuffer, { ignoreEncryption: true });
                                    loadedSrcDocs.set(item.pdfId, srcDoc);
                                }
                                const [copiedPage] = await outPdf.copyPages(srcDoc, [item.pageIndex]);
                                if (item.rotation) {
                                    const curAngle = copiedPage.getRotation().angle || 0;
                                    copiedPage.setRotation(degrees((curAngle + item.rotation) % 360));
                                }
                                outPdf.addPage(copiedPage);

                                if (hasAnyOverlay(item)) {
                                    const { width: pw, height: ph } = copiedPage.getSize();
                                    const overlayBytes = await createTransparentOverlayPng(Math.round(pw * 2), Math.round(ph * 2), item, i, sequence.length);
                                    if (overlayBytes) {
                                        const embeddedOverlay = await outPdf.embedPng(overlayBytes);
                                        copiedPage.drawImage(embeddedOverlay, { x: 0, y: 0, width: pw, height: ph });
                                    }
                                }
                            } catch (copyErr) {
                                console.warn("Fallback to rendered image for PDF page:", copyErr);
                                await addImagePageToPdfLib(outPdf, item.dataUrl, quality);
                            }
                        } else {
                            await addImagePageToPdfLib(outPdf, item.dataUrl, quality);
                        }

                        const percent = Math.round(((i + 1) / sequence.length) * 100);
                        if (onProgress) onProgress(percent, `PROCESSING ${percent}%`);
                    }

                    const pdfBytes = await outPdf.save();
                    blobResult = new Blob([pdfBytes], { type: 'application/pdf' });
                } else {
                    const { jsPDF } = window.jspdf;
                    let pdf = null;

                    for (let i = 0; i < sequence.length; i++) {
                        const imgObj = sequence[i];
                        const { blob } = await imageToBytes(imgObj.dataUrl, 'image/jpeg', quality);
                        const compressedUrl = URL.createObjectURL(blob);

                        await new Promise(resolve => {
                            let img = new Image();
                            img.onload = () => {
                                let imgW = img.naturalWidth; let imgH = img.naturalHeight;
                                let isLandscape = imgW > imgH; let orientation = isLandscape ? 'l' : 'p';
                                let a4W = isLandscape ? 297 : 210; let a4H = isLandscape ? 210 : 297;

                                if (i === 0) {
                                    const opts = { orientation: orientation, unit: 'mm', format: 'a4' };
                                    if (password) {
                                        opts.encryption = {
                                            userPassword: password,
                                            ownerPassword: password,
                                            userPermissions: ['print']
                                        };
                                    }
                                    pdf = new jsPDF(opts);
                                    pdf.setDisplayMode('100%', 'continuous', 'UseOutlines');
                                } else {
                                    pdf.addPage('a4', orientation);
                                }

                                let ratio = imgW / imgH; let drawW = a4W; let drawH = a4W / ratio;
                                if (drawH > a4H) { drawH = a4H; drawW = a4H * ratio; }
                                
                                pdf.addImage(img, 'JPEG', (a4W - drawW) / 2, (a4H - drawH) / 2, drawW, drawH);
                                URL.revokeObjectURL(compressedUrl);
                                resolve();
                            };
                            img.src = compressedUrl;
                        });

                        const percent = Math.round(((i + 1) / sequence.length) * 100);
                        if (onProgress) onProgress(percent, `PROCESSING ${percent}%`);
                    }

                    blobResult = pdf.output('blob');
                }
                extResult = '.pdf';
            }

            return { blob: blobResult, ext: extResult };
        }

            );

            initNierSelects(document.getElementById('popupBody'));
            $('#confirmExportBtn').css({'background-color': 'var(--nier-dark)', 'color': '#d3cebb'});

            async function updateEstimatedSize() {
                const token = ++estimateCalcToken;
                cachedExportPackage = null;
                const estEl = document.getElementById('exportEstimateText');

        async function executeExportProcess(sequence, baseFileName, format, quality, password) {
            estimateCalcToken++; // Dừng các tiến trình tính toán ngầm
            actionSound.currentTime = 0; actionSound.play();

            $('#popupOverlay, #customPopup').stop(true, true);
            $('#popupOverlay').css('pointer-events', 'none');
            showPopup(
                "PROCESSING DATA...", 
                `<p style="text-align:center;">Compiling output package...</p>
                 <div class="progress-container">
                    <div id="pdfProgressBar" class="progress-bar"></div>
                    <div id="pdfProgressText" class="progress-text">STANDBY 0%</div>
                 </div>`, 
                []
            );
            $('#popupButtons').hide();

            setTimeout(async () => {
                const bar = document.getElementById('pdfProgressBar');
                const pText = document.getElementById('pdfProgressText');

                try {
                    const cacheKey = `${format}_${quality}_${password}`;
                    let finalExtension = '.pdf';

                    if (cachedExportPackage && cachedExportPackage.key === cacheKey && format !== 'jpg' && format !== 'png') {
                        generatedExportBlob = cachedExportPackage.blob;
                        finalExtension = cachedExportPackage.ext;
                        if (bar) bar.style.width = '100%';
                        if (pText) pText.textContent = 'PROCESSING 100%';
                    } else {
                        const result = await buildExportPackage(
                            sequence,
                            baseFileName,
                            format,
                            quality,
                            password,
                            (pct, text) => {
                                if (bar) bar.style.width = pct + '%';
                                if (pText) pText.textContent = text;
                            }
                        );
                        generatedExportBlob = result.blob;
                        finalExtension = result.ext;
                    }

                    let finalFileName = baseFileName;
                    if (!finalFileName.toLowerCase().endsWith(finalExtension)) {
                        finalFileName = finalFileName.replace(/\.[^/.]+$/, "") + finalExtension;
                    }

                    setTimeout(() => {
                        $('#popupOverlay').css('pointer-events', 'auto');
                        $('#popupButtons').show();
                        
                        showPopup(
                            "EXPORT COMPLETE",
                            `<p style="text-align:center;">Package compiled (${formatFileSize(generatedExportBlob.size)}). Ready for download:</p>
                             <input type="text" id="finalDownloadName" class="popup-input" value="${finalFileName}" style="text-align:center;">`,
                            [
                                {
                                    text: "DOWNLOAD",
                                    id: "downloadPdfBtn",
                                    action: function() {
                                        actionSound.currentTime = 0; actionSound.play();
                                        let dlName = $('#finalDownloadName').val().trim() || finalFileName;
                                        if (!dlName.toLowerCase().endsWith(finalExtension)) dlName += finalExtension;
                                        const link = document.createElement('a');
                                        const url = URL.createObjectURL(generatedExportBlob);
                                        link.href = url; link.download = dlName;
                                        document.body.appendChild(link); link.click(); document.body.removeChild(link); URL.revokeObjectURL(url);
                                    }
                                },
                                {
                                    text: "START OVER",
                                    action: function() { 
                                        clickSound.currentTime = 0; clickSound.play(); 
                                        setTimeout(() => { location.reload(); }, 300); 
                                    }
                                }
                            ]
                        );
                        
                        $('#downloadPdfBtn').css({'background-color': 'var(--nier-dark)', 'color': '#d3cebb'});
                    }, 350);
                } catch (err) {
                    console.error("Error exporting:", err);
                    $('#popupOverlay').css('pointer-events', 'auto');
                    $('#popupButtons').show();
                    showPopup("SYSTEM ERROR", "<p style='text-align:center;'>An error occurred while compiling the export package.</p>");
                }
            }, 350);
        }

    </script>
</body>
</html>
