    <style>
        @import url('https://fonts.googleapis.com/css?family=Montserrat:200,200i,400,400i,600,700');

        :root {
            --primary-color: #008a008a;
            --secondary-color: #850000;
            --nier-dark: #4b4340;
            --nier-beige: #ccc6b0;
            --nier-panel: rgba(216, 210, 186, .5);
            --nier-bg-btn: #4e493a;
            --nier-text-light: #d3cebb;
            --nier-error-red: #850000;
        }

        * {
            box-sizing: border-box; margin: 0; padding: 0;
            scrollbar-color: rgba(100, 98, 86, 0.8) rgba(143, 139, 122, 0.7);
            scrollbar-width: auto;
        }

        ::-moz-selection { color: #d3cebb; background: rgba(100, 98, 86, 0.8); }
        ::selection { color: #d3cebb; background: rgba(100, 98, 86, 0.8); }

        body {
            font-family: 'Montserrat', sans-serif; background-color: var(--nier-beige);
            background-image: linear-gradient(90deg, rgba(198, 192, 170, .5) 30%, transparent 30%),
                linear-gradient(rgba(198, 192, 170, .5) 30%, transparent 30%);
            background-size: 5px 5px; color: var(--nier-dark); min-height: 100vh;
        }
        
        body.no-scroll { overflow: hidden !important; }

        .coreSystem { display: inline-block; width: 100%; min-height: 100vh; box-shadow: inset 0px 0px 100px 20px rgba(0, 0, 0, 0.3); padding: 20px; }
        .warp-container { margin-top: 1em; width: 100%; max-width: 1200px; margin-left: auto; margin-right: auto; }
        .title-main { font-size: 26px; text-shadow: 4px 5px rgba(162, 156, 142, .8); margin-bottom: 20px; text-transform: uppercase; padding-left: 10px; }
        
        /* --- NIER COMMAND TOOLBAR --- */
        .nier-toolbar {
            background: var(--nier-panel);
            box-shadow: 2px 2px 1px #4f4b42;
            border-left: 6px solid var(--nier-dark);
            padding: 12px 18px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            position: relative;
        }
        .nier-toolbar::before {
            content: '';
            position: absolute;
            top: 0; left: 4px; right: 0;
            height: 2px;
            background: rgba(75, 67, 64, 0.35);
            pointer-events: none;
        }
        .toolbar-group {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .toolbar-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #d3cebb;
            background: rgba(100, 98, 86, 0.85);
            padding: 6px 10px;
            margin-right: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .toolbar-divider {
            width: 2px;
            height: 28px;
            background: rgba(75, 67, 64, 0.35);
            margin: 0 4px;
        }
        .tool-btn {
            cursor: pointer;
            padding: 7px 11px;
            border: 1.5px solid var(--nier-dark);
            background: linear-gradient(to right, #4e493a 50%, rgba(216, 210, 186, 0.4) 50%);
            background-size: 200% 100%;
            background-position: right bottom;
            color: var(--nier-dark);
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background-position 0.2s ease-out, color 0.2s ease-out, transform 0.1s;
            position: relative;
            user-select: none;
        }
        .tool-btn i {
            font-size: 12px;
        }
        .tool-btn:hover:not(:disabled) {
            color: var(--nier-text-light);
            background-position: left bottom;
        }
        .tool-btn:active:not(:disabled) {
            transform: translateY(1px);
        }
        .tool-btn.active-modifier {
            background: var(--nier-dark);
            color: var(--nier-text-light);
            box-shadow: inset 0 0 0 1px var(--nier-beige);
        }
        .toolbar-status {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--nier-dark);
            opacity: 0.85;
            padding: 4px 10px;
            border: 1px dashed rgba(75, 67, 64, 0.5);
            background: rgba(216, 210, 186, 0.35);
            white-space: nowrap;
        }

        /* --- NIER CURSOR TOOLTIP (1S DELAY IN, 0.2S FADE IN/OUT) --- */
        #nierTooltip {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 999999;
            pointer-events: none;
            background: rgba(48, 44, 40, 0.96);
            color: var(--nier-text-light);
            border: 1.5px solid var(--nier-beige);
            border-left: 5px solid var(--nier-beige);
            box-shadow: 4px 4px 12px rgba(0, 0, 0, 0.45);
            padding: 8px 12px;
            max-width: 270px;
            text-align: left;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, visibility 0.2s ease;
        }
        #nierTooltip.visible {
            opacity: 1;
            visibility: visible;
        }
        #nierTooltip .tip-title {
            font-size: 12px;
            font-weight: 700;
            color: #ece7d5;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            line-height: 1.35;
            text-align: left;
        }
        #nierTooltip .tip-desc {
            font-size: 11px;
            font-weight: 400;
            color: #c7c1ae;
            margin-top: 4px;
            line-height: 1.4;
            text-align: left;
            border-top: 1px solid rgba(211, 206, 187, 0.25);
            padding-top: 4px;
        }

        /* --- MAIN WORKSPACE & STICKY PREVIEW --- */
        .function-wrapper { display: flex; flex-direction: row; gap: 2em; align-items: flex-start; }
        .section { background: var(--nier-panel); box-shadow: 2px 2px 1px #4f4b42; padding: 25px; display: flex; flex-direction: column; }
        .input-panel { flex: 0 0 600px; }
        .result-panel {
            flex: 1;
            min-width: 0;
            position: sticky;
            top: 20px;
            align-self: flex-start;
        }
        .sectionTitle { padding: 10px 15px; color: #d3cebb; background: rgba(100, 98, 86, 0.8); font-weight: bold; margin-bottom: 14px; font-size: 14px; text-transform: uppercase; }

        /* --- RESPONSIVE MOBILE --- */
        @media (max-width: 900px) {
            .function-wrapper { flex-direction: column; align-items: stretch; }
            .input-panel { flex: none; width: 100%; }
            .result-panel { width: 100%; position: static; }
            #previewWrapper { height: 45vh !important; }
            .title-main { text-align: center; font-size: 22px; padding-left: 0; }
            .gallery-nav { width: 25vw !important; }
            #galleryPrev { width: calc(8vw + 15px) !important; padding-left: calc(8% + 15px) !important; }
            #galleryNext { width: calc(8vw + 15px) !important; padding-right: calc(8% + 15px) !important; }
            .dropzone { padding: 30px 15px; }
            .coreSystem { padding: 10px; }
            .section { padding: 15px; }
            .nier-toolbar { padding: 10px 12px; }
            .toolbar-divider { display: none; }
            .toolbar-status { width: 100%; text-align: center; }
        }

        /* --- UPLOAD ZONE & URL IMPORT BOX --- */
        .url-import-box {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
            width: 100%;
        }
        .url-import-textarea {
            width: 100%;
            height: 48px;
            min-height: 48px;
            max-height: 120px;
            padding: 7px 10px;
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            font-weight: 600;
            line-height: 1.4;
            border: 2px solid var(--nier-dark);
            background: rgba(216, 210, 186, 0.45);
            color: var(--nier-dark);
            outline: none;
            resize: vertical;
            transition: background 0.2s, box-shadow 0.2s;
        }
        .url-import-textarea::placeholder {
            color: rgba(75, 67, 64, 0.65);
            font-weight: 400;
        }
        .url-import-textarea:focus {
            background: rgba(216, 210, 186, 0.85);
            box-shadow: inset 3px 0 0 var(--nier-dark);
        }
        .themebutton.url-import-btn {
            width: 100%;
            height: 30px;
            margin-top: 0 !important;
            padding: 4px 12px !important;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 11px;
        }
        .themebutton.url-import-btn i {
            font-size: 12px;
        }

        .url-progress-list {
            max-height: 240px;
            overflow-y: auto;
            padding-right: 4px;
            margin: 10px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .url-progress-item {
            background: rgba(100, 98, 86, 0.12);
            border: 1px solid rgba(75, 67, 64, 0.45);
            padding: 8px 10px;
        }
        .url-progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
            font-size: 11px;
            font-weight: 700;
        }
        .url-progress-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--nier-dark);
            flex: 1;
            text-align: left;
        }
        .url-progress-status {
            font-size: 10px;
            text-transform: uppercase;
            padding: 2px 6px;
            background: rgba(75, 67, 64, 0.2);
            color: var(--nier-dark);
            flex-shrink: 0;
        }
        .url-progress-status.status-ok {
            background: var(--nier-dark);
            color: var(--nier-text-light);
        }
        .url-progress-status.status-err {
            background: var(--nier-error-red);
            color: #ffffff;
        }
        .url-mini-progress {
            height: 18px;
            margin: 0;
            border-width: 1.5px;
        }
        .url-mini-progress .progress-text {
            font-size: 10px;
        }
        .url-error-summary {
            margin-top: 10px;
            padding: 8px 10px;
            background: rgba(133, 0, 0, 0.1);
            border-left: 4px solid var(--nier-error-red);
            color: var(--nier-error-red);
            font-size: 11px;
            font-weight: 600;
            line-height: 1.45;
            max-height: 110px;
            overflow-y: auto;
            text-align: left;
        }

        .dropzone { width: 100%; padding: 20px 15px; border: 2px dashed var(--nier-dark); background: rgba(216, 210, 186, 0.3); text-align: center; cursor: pointer; transition: all 0.2s; margin-bottom: 14px; }
        .dropzone.hover { background: rgba(100, 98, 86, 0.2); border-color: var(--nier-bg-btn); }
        .dropzone p { font-weight: bold; font-size: 14px; }
        .dropzone small { font-size: 11px; opacity: 0.8; }
        #fileInput { display: none; }

        /* --- THUMBNAILS GRID & DRAG ANIMATIONS --- */
        .thumb-grid { display: flex; flex-wrap: wrap; gap: 25px 15px; min-height: 150px; background: rgba(100, 98, 86, 0.1); padding: 15px; border: 1px solid var(--nier-dark); align-content: flex-start; }
        
        .thumb-wrapper {
            display: flex; flex-direction: column; align-items: center; width: 100px;
            transform-origin: center left; overflow: visible; 
        }
        
        .thumb-wrapper.removing { 
            width: 0 !important; margin: 0 !important; padding: 0 !important;
            opacity: 0; overflow: hidden !important; transition: all 5ms linear;
        }
        .thumb-wrapper.removing * { display: none !important; }

        .thumb-box {
            width: 100%; height: 130px; border: 2px solid var(--nier-dark); background: #000;
            position: relative; cursor: grab; display: flex; flex-direction: column;
            box-shadow: 2px 2px 1px #4f4b42; margin-bottom: 8px; flex-shrink: 0;
        }
        .thumb-wrapper.active-target .thumb-box {
            border-color: var(--nier-error-red);
            box-shadow: 0 0 0 1px var(--nier-error-red), 2px 2px 4px rgba(0,0,0,0.6);
        }
        .thumb-box img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
        
        .thumb-name {
            color: var(--nier-dark); font-size: 11px; font-weight: bold; text-align: center;
            width: 100%; line-height: 1.4; padding: 0 2px;
            white-space: normal; word-wrap: break-word; pointer-events: none;
        }

        .thumb-checkbox { position: absolute; top: -5px; left: -5px; width: 18px; height: 18px; cursor: pointer; z-index: 5; accent-color: var(--nier-dark); box-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        
        .thumb-delete {
            position: absolute; top: -5px; right: -5px; width: 24px; height: 24px;
            background: transparent; color: rgba(75, 67, 64, 0.4); 
            border: 1px solid rgba(75, 67, 64, 0.4); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; cursor: pointer; z-index: 5;
            opacity: 0; transition: all 0.2s; box-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .thumb-rotate {
            position: absolute; bottom: -5px; right: -5px; width: 24px; height: 24px;
            background: rgba(216, 210, 186, 0.75); color: var(--nier-dark);
            border: 1px solid var(--nier-dark); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; cursor: pointer; z-index: 5;
            opacity: 0; transition: all 0.2s; box-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        
        .thumb-wrapper:hover .thumb-delete,
        .thumb-wrapper:hover .thumb-rotate { opacity: 1; }
        .show-delete-mobile .thumb-delete,
        .show-delete-mobile .thumb-rotate { opacity: 1 !important; }
        .thumb-delete:hover { 
            background: rgba(216, 210, 186, 0.9) !important; color: var(--nier-error-red) !important; 
            border-color: var(--nier-error-red) !important; transform: scale(1.1); 
        }
        .thumb-rotate:hover {
            background: var(--nier-dark) !important; color: var(--nier-text-light) !important;
            border-color: var(--nier-beige) !important; transform: rotate(90deg) scale(1.1);
        }

        /* --- Sortable Customization --- */
        .nier-drag, .nier-fallback {
            transition: none !important;
        }
        .nier-drag .thumb-box, .nier-fallback .thumb-box { 
            transform: rotate(4deg) scale(1.05); 
            box-shadow: 5px 5px 15px rgba(0,0,0,0.5); 
            border-color: var(--nier-beige); 
        }
        .nier-fallback { 
            opacity: 0.9 !important; z-index: 99999 !important; 
            cursor: grabbing !important; width: 100px !important; 
        }
        .nier-ghost {
            opacity: 0.4 !important; visibility: visible !important; 
            background: rgba(100, 98, 86, 0.2); border: 2px dashed var(--nier-dark); box-shadow: none;
            overflow: visible; display: flex; align-items: center; justify-content: center;
            position: relative; height: 130px !important; width: 100px !important; margin-bottom: auto; border-radius: 2px;
        }
        .nier-ghost * { display: none !important; }
        .nier-ghost::after {
            content: attr(data-slot); font-family: 'Montserrat', sans-serif; font-size: 45px; font-weight: bold;
            color: rgba(75, 67, 64, 0.4); text-shadow: 1px 1px 2px rgba(216, 210, 186, 0.8);
            position: absolute; top: 35px;
        }

        /* --- DYNAMIC PREVIEW PANEL --- */
        #previewWrapper { width: 100%; height: 60vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .preview-box {
            width: 100%; height: 100%; background: rgba(0,0,0,0.8); border: 2px solid var(--nier-dark);
            box-shadow: inset 0px 0px 20px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;
            position: relative; margin-bottom: 0px; cursor: pointer; overflow: hidden;
            transition: width 0.4s cubic-bezier(0.25, 1, 0.5, 1), height 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .preview-box img { width: 100%; height: 100%; object-fit: contain; display: none; transition: transform 0.2s; }
        .preview-box:hover img { transform: scale(1.02); }
        .preview-box p.placeholder { color: #d3cebb; font-size: 12px; opacity: 0.5; text-transform: uppercase; pointer-events: none; }
        .preview-name-outside { color: var(--nier-dark); font-size: 13px; font-weight: bold; text-align: center; width: 100%; word-wrap: break-word; display: none; margin-top: 15px; }

        /* --- BUTTONS --- */
        .themebutton {
            cursor: pointer; padding: 12px 20px; font-weight: bold; color: #4b4340; border: 2px solid var(--nier-dark);
            background: linear-gradient(to right, #4e493a 50%, rgba(0, 0, 0, 0) 50%); background-size: 200% 100%;
            background-position: right bottom; transition: all .2s ease-out; font-family: 'Montserrat', sans-serif;
            text-transform: uppercase; text-align: center; width: 100%; margin-top: 15px;
        }
        .themebutton:hover:not(:disabled) { color: #d3cebb; background-position: left bottom; }

        /* --- GALLERY OVERLAY --- */
        #galleryOverlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95); z-index: 10000; flex-direction: column; perspective: 1500px;
            opacity: 0; visibility: hidden; transition: opacity 0.2s, visibility 0.2s; 
        }
        #galleryOverlay.show { opacity: 1; visibility: visible; }
        .gallery-main { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; cursor: default; }
        .gallery-img-container {
            position: absolute; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
            transform-style: preserve-3d; transition: all 0.1s ease-out; pointer-events: none;
        }
        .gallery-img-container img { max-width: 95%; max-height: 85%; object-fit: contain; pointer-events: auto; }

        .anim-out-left { transform: translateX(-50vw) rotateY(-45deg); opacity: 0; }
        .anim-in-right { transform: translateX(50vw) rotateY(45deg); opacity: 0; }
        .anim-out-right { transform: translateX(50vw) rotateY(45deg); opacity: 0; }
        .anim-in-left { transform: translateX(-50vw) rotateY(-45deg); opacity: 0; }
        .anim-center { transform: translateX(0) rotateY(0); opacity: 1; }

        .gallery-nav {
            position: absolute; top: 0; bottom: 80px; width: 15vw; display: flex; align-items: center; justify-content: center;
            color: rgba(255,255,255,0.2); font-size: 45px; cursor: pointer; transition: 0.2s; z-index: 10000; transform: translateZ(0); 
        }
        #galleryPrev { left: -15px; width: calc(8vw + 15px); justify-content: flex-start; padding-left: calc(3% + 15px); }
        #galleryPrev:hover { background: radial-gradient(ellipse 100% 40% at 15px center, rgba(216,210,186,0.2) 0%, transparent 100%); color: rgba(216, 210, 186, 0.8); }
        #galleryNext { right: -15px; width: calc(8vw + 15px); justify-content: flex-end; padding-right: calc(3% + 15px); }
        #galleryNext:hover { background: radial-gradient(ellipse 100% 40% at calc(100% - 15px) center, rgba(216,210,186,0.2) 0%, transparent 100%); color: rgba(216, 210, 186, 0.8); }
        
        .gallery-close { position: absolute; top: 25px; right: 35px; color: rgba(216, 210, 186, 0.5); font-size: 35px; cursor: pointer; z-index: 10005; padding: 10px; transition: color 0.2s;}
        .gallery-close:hover { color: #ffffff; }
        .gallery-counter { position: absolute; bottom: 110px; width: 100%; text-align: center; color: #fff; font-size: 14px; font-weight: bold; z-index: 10; text-shadow: 1px 1px 2px #000; pointer-events: none; }
        .gallery-strip { height: 80px; width: 100%; background: rgba(20, 20, 20, 0.9); border-top: 1px solid var(--nier-dark); display: flex; align-items: center; gap: 10px; padding: 0 20px; overflow-x: auto; z-index: 10; }
        .gallery-thumb { width: 50px; height: 60px; border: 2px solid transparent; opacity: 0.5; cursor: pointer; transition: 0.2s; object-fit: cover; }
        .gallery-thumb:hover { opacity: 0.8; }
        .gallery-thumb.active { border-color: var(--nier-beige); opacity: 1; transform: scale(1.1); }

        /* --- POPUP FORM CONTROLS & CUSTOM NIER SELECT BOX --- */
        .progress-container { width: 100%; border: 2px solid var(--nier-dark); background: rgba(100, 98, 86, 0.2); height: 30px; position: relative; margin: 20px 0; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; background: var(--nier-dark); transition: width 0.2s ease; }
        .progress-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #d3cebb; font-weight: bold; font-size: 12px; mix-blend-mode: difference; white-space: nowrap; }

        .nier-form-group { margin-bottom: 12px; text-align: left; position: relative; }
        .nier-form-label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; margin-bottom: 5px; color: var(--nier-dark); }
        .nier-select, .nier-input, .nier-textarea {
            width: 100%; padding: 8px 10px; font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 600;
            color: var(--nier-dark); background: rgba(216, 210, 186, 0.65); border: 1.5px solid var(--nier-dark); outline: none;
        }
        .nier-input:focus, .nier-textarea:focus {
            background: rgba(216, 210, 186, 0.9);
            box-shadow: inset 3px 0 0 var(--nier-dark);
        }
        .nier-textarea { resize: vertical; min-height: 70px; font-weight: 400; }
        .nier-row { display: flex; gap: 10px; }
        .nier-row > * { flex: 1; min-width: 0; }
        .nier-check-row {
            display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700;
            cursor: pointer; padding: 6px 0; user-select: none; text-align: left;
        }
        .nier-check-row input { width: 16px; height: 16px; accent-color: var(--nier-dark); cursor: pointer; }

        /* Custom NieR Selection Box (Thay thế màu xanh dương mặc định của trình duyệt bằng màu tối NieR) */
        .nier-select-native-hidden {
            display: none !important;
        }
        .nier-custom-select {
            position: relative;
            width: 100%;
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            font-weight: 600;
            user-select: none;
        }
        .nier-select-trigger {
            width: 100%;
            padding: 8px 30px 8px 10px;
            background: rgba(216, 210, 186, 0.75);
            border: 1.5px solid var(--nier-dark);
            color: var(--nier-dark);
            cursor: pointer;
            position: relative;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background 0.15s, color 0.15s;
        }
        .nier-select-trigger::after {
            content: '\f078';
            font-family: 'Font Awesome 5 Free';
            font-weight: 900;
            font-size: 10px;
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            transition: transform 0.2s ease;
        }
        .nier-custom-select.open .nier-select-trigger {
            background: var(--nier-dark);
            color: var(--nier-text-light);
        }
        .nier-custom-select.open .nier-select-trigger::after {
            transform: translateY(-50%) rotate(180deg);
        }
        .nier-select-options {
            display: none;
            position: absolute;
            top: calc(100% + 2px);
            left: 0;
            right: 0;
            background: #d8d2ba;
            border: 1.5px solid var(--nier-dark);
            box-shadow: 3px 3px 0px rgba(75, 67, 64, 0.85);
            max-height: 190px;
            overflow-y: auto;
            z-index: 10050;
        }
        .nier-custom-select.open .nier-select-options {
            display: block;
        }
        .nier-select-option {
            padding: 8px 10px;
            color: var(--nier-dark);
            cursor: pointer;
            border-bottom: 1px solid rgba(75, 67, 64, 0.15);
            transition: background 0.12s, color 0.12s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nier-select-option:last-child {
            border-bottom: none;
        }
        .nier-select-option:hover,
        .nier-select-option.selected {
            background: var(--nier-dark) !important;
            color: var(--nier-text-light) !important;
        }
        .nier-select-option.selected::before {
            content: '■';
            font-size: 9px;
            color: var(--nier-text-light);
        }

        /* Range Slider NieR Style */
        .nier-range {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            background: rgba(75, 67, 64, 0.3);
            border: 1px solid var(--nier-dark);
            outline: none;
            margin-top: 6px;
        }
        .nier-range::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: var(--nier-dark);
            border: 2px solid var(--nier-beige);
            cursor: pointer;
        }
        .nier-range::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--nier-dark);
            border: 2px solid var(--nier-beige);
            cursor: pointer;
        }

        /* Password Input with Eye Toggle */
        .nier-password-wrapper {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
        }
        .nier-password-wrapper .nier-input {
            padding-right: 36px;
        }
        .nier-pwd-eye {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: var(--nier-dark);
            cursor: pointer;
            font-size: 14px;
            padding: 4px;
            opacity: 0.75;
            transition: opacity 0.15s;
        }
        .nier-pwd-eye:hover {
            opacity: 1;
        }

        /* Estimated File Size Text (Italic & Left-Aligned) */
        .estimate-size-text {
            font-family: 'Montserrat', sans-serif;
            font-weight: 400;
            font-style: italic;
            font-size: 12px;
            color: var(--nier-dark);
            text-align: left;
            margin-top: 12px;
            margin-bottom: -6px;
            letter-spacing: 0.2px;
        }
    </style>
</head>
<body>
    <audio id="hover-sound" src="https://hoanganhdinhngoc.github.io/cdn/sounds/core_16.ogg"></audio>
    <audio id="click-sound" src="https://hoanganhdinhngoc.github.io/cdn/sounds/core_52.ogg"></audio>
    <audio id="action-sound" src="https://hoanganhdinhngoc.github.io/cdn/sounds/core_58.ogg"></audio>
    <audio id="open-close-sound" src="https://hoanganhdinhngoc.github.io/cdn/sounds/core_1.ogg"></audio>
    <audio id="delete-sound" src="https://hoanganhdinhngoc.github.io/cdn/sounds/core_76.ogg"></audio>

    <!-- Nier Cursor Tooltip -->
    <div id="nierTooltip">
        <div class="tip-title" id="nierTipTitle"></div>
        <div class="tip-desc" id="nierTipDesc"></div>
    </div>

    <div id="galleryOverlay">

        <div class="gallery-nav" id="galleryPrev"><i class="fas fa-chevron-left"></i></div>
        <div class="gallery-nav" id="galleryNext"><i class="fas fa-chevron-right"></i></div>
        
        <div class="gallery-main" id="galleryMain">
            <div class="gallery-img-container anim-center" id="galleryImgContainer">
                <img src="" id="galleryMainImg">
            </div>
        </div>

        <div class="gallery-counter" id="galleryCounterText">1 / 1</div>
        <div class="gallery-strip" id="galleryStrip"></div>
    </div>

    <div class="coreSystem">
        <div class="warp-container">
            <h1 class="title-main">PDF Editor</h1>

            <!-- NIER PROFESSIONAL EDITOR TOOLBAR -->
            <div class="nier-toolbar" id="editorToolbar">
                <div class="toolbar-group">
                    <div class="toolbar-label"><i class="fas fa-sliders-h"></i> TOOLS</div>

                    <button type="button" class="tool-btn" id="toolAddNote"
                        data-tip-title="Attach Page Note"
                        data-tip-desc="Stamp a framed NieR-style annotation callout box onto the page corner.">

                    </button>

                    <button type="button" class="tool-btn" id="toolWatermark"
                        data-tip-title="Document Watermark"
                        data-tip-desc="Apply single or repeating pattern watermark text across pages.">
                        <i class="fas fa-stamp"></i><span>WATERMARK</span>
                    </button>

                    <button type="button" class="tool-btn" id="toolPageNum"
                        data-tip-title="Auto Page Numbering"
                        data-tip-desc="Automatically stamp sequence numbers with custom color and opacity.">
                        <i class="fas fa-list-ol"></i><span>PAGE NUM</span>
                    </button>

                    <div class="toolbar-divider"></div>

                    <button type="button" class="tool-btn" id="toolBlankPage"
                        data-tip-title="Insert Blank Page">

                    <button type="button" class="tool-btn" id="toolExtractText"
                        data-tip-title="Extract PDF Text"
                        data-tip-desc="Parse embedded text streams directly from PDF pages without OCR into plain text.">
                        <i class="fas fa-file-alt"></i><span>EXTRACT TXT</span>
                    </button>

                    <button type="button" class="tool-btn" id="toolResetEdits"
                        data-tip-title="Reset Page Overlays"
                        data-tip-desc="Clear note, watermark, and page number overlays to restore original pages.">
                        <i class="fas fa-undo"></i><span>RESET</span>

                <div class="toolbar-status" id="toolbarStatusText">TARGET: NONE</div>
            </div>
            
            <div class="function-wrapper">
                <div class="input-panel section">
                    <h2 class="sectionTitle">Data Input & Sequence</h2>
                    <div class="url-import-box">
                        <textarea id="urlImportInput" class="url-import-textarea" placeholder="Import PDF or Image from URL(s) — Enter one URL per line (separate line by line)..."></textarea>
                        <button type="button" id="urlImportBtn" class="themebutton url-import-btn">
                            <i class="fas fa-cloud-download-alt"></i>
                            <span>IMPORT</span>
                        </button>
                    </div>
                    <div class="dropzone" id="dropZone">
                        <p>CLICK HERE OR DROP FILES TO UPLOAD</p>

                        <input type="file" id="fileInput" multiple accept="image/*,application/pdf,.pdf">
                    </div>
                    <div class="thumb-grid" id="thumbGrid"></div>
                    <button id="convertBtn" class="themebutton">Export</button>

                <div class="result-panel">
                    <div class="section">
                        <h2 class="sectionTitle">Target Preview</h2>
                        <div id="previewWrapper">
                            <div class="preview-box" id="mainPreviewBox">
                                <p class="placeholder" id="previewPlaceholder">Select a page or image to inspect.</p>
                                <img id="mainPreviewImg" src="">
                            </div>
                        </div>
                        <div class="preview-name-outside" id="mainPreviewName"></div>

    <script>
        const hoverSound = document.getElementById("hover-sound");
        const clickSound = document.getElementById("click-sound");
        const actionSound = document.getElementById("action-sound");
        const openCloseSound = document.getElementById("open-close-sound");
        const deleteSound = document.getElementById("delete-sound");

        const pdfjsLib = window['pdfjs-dist/build/pdf'];
        if (pdfjsLib) {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }
        
        let uploadedFiles = []; 
        const pdfBuffersMap = new Map();
        const pdfPasswordsMap = new Map();
        let generatedExportBlob = null;
        let currentPreviewData = null; 
        let currentPreviewId = null;

        // Cấu hình Watermark (hỗ trợ Single & Pattern Mode)
        let watermarkConfig = {
            enabled: false,
            text: 'CONFIDENTIAL',
            style: 'diagonal', // 'diagonal' | 'horizontal'
            color: '#4b4340',
            opacity: 0.25,
            sizeRatio: 0.065,
            isPattern: false,
            spacing: 24 // Khoảng cách giãn cách giữa các chữ trong pattern (% kích thước trang)
        };

        // Cấu hình Đánh số trang (hỗ trợ nhiều màu sắc & độ đậm nhạt Opacity)
        let pageNumberConfig = {
            enabled: false,
            position: 'bottom-center', // 'bottom-center' | 'bottom-right' | 'bottom-left' | 'top-right' | 'top-center'
            format: 'slash', // 'slash' (1 / N) | 'page' (Page 1 of N) | 'dash' (- 1 -)
            color: '#4b4340',
            opacity: 0.90
        };

        // --- HỆ THỐNG CUSTOM NIER SELECT BOX (THAY THẾ DROPDOWN MẶC ĐỊNH) ---
        function initNierSelects(root = document) {
            root.querySelectorAll('select.nier-select:not(.nier-select-native-hidden)').forEach(selectEl => {
                selectEl.classList.add('nier-select-native-hidden');

                const wrapper = document.createElement('div');
                wrapper.className = 'nier-custom-select';

                const trigger = document.createElement('div');
                trigger.className = 'nier-select-trigger';

                const optionsBox = document.createElement('div');
                optionsBox.className = 'nier-select-options';

                function rebuildOptions() {
                    optionsBox.innerHTML = '';
                    const selectedOpt = selectEl.options[selectEl.selectedIndex] || selectEl.options[0];
                    trigger.textContent = selectedOpt ? selectedOpt.textContent : '';

                    Array.from(selectEl.options).forEach((opt, idx) => {
                        const item = document.createElement('div');
                        item.className = 'nier-select-option' + (idx === selectEl.selectedIndex ? ' selected' : '');
                        item.textContent = opt.textContent;
                        item.dataset.value = opt.value;

                        item.addEventListener('mouseenter', () => {
                            hoverSound.currentTime = 0; hoverSound.play();
                        });

                        item.addEventListener('click', (e) => {
                            e.stopPropagation();
                            clickSound.currentTime = 0; clickSound.play();
                            selectEl.selectedIndex = idx;
                            trigger.textContent = opt.textContent;
                            optionsBox.querySelectorAll('.nier-select-option').forEach((el, i) => {
                                el.classList.toggle('selected', i === idx);
                            });
                            wrapper.classList.remove('open');
                            $(selectEl).trigger('change');
                        });

                        optionsBox.appendChild(item);
                    });
                }

                rebuildOptions();

                trigger.addEventListener('mouseenter', () => {
                    hoverSound.currentTime = 0; hoverSound.play();
                });

                trigger.addEventListener('click', (e) => {
                    e.stopPropagation();
                    clickSound.currentTime = 0; clickSound.play();
                    const isOpen = wrapper.classList.contains('open');
                    document.querySelectorAll('.nier-custom-select.open').forEach(el => el.classList.remove('open'));
                    if (!isOpen) wrapper.classList.add('open');
                });

                selectEl.parentNode.insertBefore(wrapper, selectEl.nextSibling);
                wrapper.appendChild(trigger);
                wrapper.appendChild(optionsBox);
            });
        }

        document.addEventListener('click', () => {
            document.querySelectorAll('.nier-custom-select.open').forEach(el => el.classList.remove('open'));
        });

        // --- HỆ THỐNG TOOLTIP BÊN PHẢI CHUỘT (HIỆN SAU 1S, FADE IN 0.2S, RỜI CHUỘT FADE OUT NGAY 0.2S) ---
        const tooltipEl = document.getElementById('nierTooltip');
        const tipTitleEl = document.getElementById('nierTipTitle');
        const tipDescEl = document.getElementById('nierTipDesc');
        let tipShowTimer = null;

        function positionTooltip(clientX, clientY) {
            const offsetX = 16;
            const offsetY = -10;
            const rect = tooltipEl.getBoundingClientRect();
            let left = clientX + offsetX;
            let top = clientY + offsetY;

            if (left + rect.width > window.innerWidth - 10) {
                left = Math.max(10, clientX - rect.width - 12);
            }
            if (top + rect.height > window.innerHeight - 10) {
                top = Math.max(10, window.innerHeight - rect.height - 10);
            }
            if (top < 10) top = 10;

            tooltipEl.style.left = left + 'px';
            tooltipEl.style.top = top + 'px';
        }

        document.querySelectorAll('.tool-btn[data-tip-title]').forEach(btn => {
            btn.addEventListener('mouseenter', (e) => {
                if (tipShowTimer) {
                    clearTimeout(tipShowTimer);
                    tipShowTimer = null;
                }
                btn._lastMouseX = e.clientX;
                btn._lastMouseY = e.clientY;

                const title = btn.getAttribute('data-tip-title') || '';
                const desc = btn.getAttribute('data-tip-desc') || '';

                tipShowTimer = setTimeout(() => {
                    tipTitleEl.textContent = title;
                    if (desc.trim() !== '') {
                        tipDescEl.textContent = desc;
                        tipDescEl.style.display = 'block';
                    } else {
                        tipDescEl.textContent = '';
                        tipDescEl.style.display = 'none';
                    }
                    positionTooltip(btn._lastMouseX, btn._lastMouseY);
                    tooltipEl.classList.add('visible');
                }, 1000); // Chuột đi vào button sau 1s mới bắt đầu hiện (fade in 0.2s)
            });

            btn.addEventListener('mousemove', (e) => {
                btn._lastMouseX = e.clientX;
                btn._lastMouseY = e.clientY;
                if (tooltipEl.classList.contains('visible')) {
                    positionTooltip(e.clientX, e.clientY);
                }
            });

            btn.addEventListener('mouseleave', () => {
                if (tipShowTimer) {
                    clearTimeout(tipShowTimer);
                    tipShowTimer = null;
                }
                // Rời chuột khỏi button thì ngay lập tức bắt đầu fade out trong 0.2s
                tooltipEl.classList.remove('visible');
            });

            btn.addEventListener('click', () => {
                if (tipShowTimer) {
                    clearTimeout(tipShowTimer);
                    tipShowTimer = null;
                }
                tooltipEl.classList.remove('visible');
            });
        });

        // --- NÂNG CẤP SORTABLEJS ---
        const sortableGrid = new Sortable(document.getElementById('thumbGrid'), {
            animation: 200, ghostClass: 'nier-ghost', dragClass: 'nier-drag',
            fallbackClass: 'nier-fallback', forceFallback: true, fallbackOnBody: true, 
            delay: 100, delayOnTouchOnly: true, 
            onStart: function(evt) { evt.item.setAttribute('data-slot', evt.oldIndex + 1); },
            onChange: function(evt) { if(evt.item) evt.item.setAttribute('data-slot', evt.newIndex + 1); },
            onEnd: function() {
                if (pageNumberConfig.enabled) {
                    refreshAllPagesComposited();
                }
                updateToolbarStatus();
            }
        });

        document.addEventListener('click', (e) => {
            const grid = document.getElementById('thumbGrid');
            if (grid) { e.target.closest('.thumb-wrapper') ? grid.classList.add('show-delete-mobile') : grid.classList.remove('show-delete-mobile'); }
        });

        $(document).on('mouseenter', '.themebutton:not(:disabled), .tool-btn:not(:disabled), .thumb-box, .dropzone, .url-import-textarea, .gallery-nav, .gallery-thumb, .gallery-close', () => { 
            hoverSound.currentTime = 0; hoverSound.play(); 
        });

        function updateToolbarStatus() {
            const statusEl = document.getElementById('toolbarStatusText');
            const activeItem = uploadedFiles.find(f => f.id === currentPreviewId);
            const checkedCount = getCheckedSequence().length;
            if (activeItem) {
                let shortName = activeItem.name;
                if (shortName.length > 26) shortName = shortName.substring(0, 23) + '...';
                statusEl.textContent = `TARGET: ${shortName} | SELECTED: ${checkedCount}`;
            } else {
                statusEl.textContent = `TARGET: NONE | SELECTED: ${checkedCount}`;
            }

            const wmBtn = document.getElementById('toolWatermark');
            const pnBtn = document.getElementById('toolPageNum');
            if (wmBtn) wmBtn.classList.toggle('active-modifier', watermarkConfig.enabled);
            if (pnBtn) pnBtn.classList.toggle('active-modifier', pageNumberConfig.enabled);
        }

        // --- UPLOAD FILES (PDF & IMAGES) ---
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');

        dropZone.addEventListener('click', () => { clickSound.play(); fileInput.click(); });
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('hover'); });
        dropZone.addEventListener('dragleave', (e) => { e.preventDefault(); dropZone.classList.remove('hover'); });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault(); dropZone.classList.remove('hover');
            if (e.dataTransfer.files.length > 0) handleFiles(e.dataTransfer.files);
        });
        fileInput.addEventListener('change', (e) => { handleFiles(e.target.files); fileInput.value = ''; });

        function isPdfFile(file) {
            return file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
        }

        function isImageFile(file) {
            return file.type.startsWith('image/') || /\.(jpe?g|png|webp|gif|bmp)$/i.test(file.name);
        }

        function getBaseFileName(fileName) {
            return fileName.replace(/\.[^/.]+$/, "") || 'Nier_Document';
        }

        async function renderPdfPageToBlobUrl(pdfPage) {
            const baseViewport = pdfPage.getViewport({ scale: 1 });
            const maxDim = Math.max(baseViewport.width, baseViewport.height);
            const scale = Math.min(2.0, Math.max(1.5, 1600 / (maxDim || 1)));
            const viewport = pdfPage.getViewport({ scale: scale });

            const canvas = document.createElement('canvas');
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            await pdfPage.render({ canvasContext: ctx, viewport: viewport }).promise;

            return new Promise((resolve) => {
                canvas.toBlob((blob) => {
                    if (blob) {
                        resolve(URL.createObjectURL(blob));
                    } else {
                        resolve(canvas.toDataURL('image/jpeg', 0.92));
                    }
                }, 'image/jpeg', 0.92);
            });
        }

        function showReadingDataPopup() {
            $('#popupOverlay, #customPopup').stop(true, true);
            $('#popupOverlay').css('pointer-events', 'none');
            showPopup(
                "READING DATA...",
                `<p id="extractStatusText" style="text-align:center;">Extracting document pages...</p>
                 <div class="progress-container">
                    <div id="extractProgressBar" class="progress-bar"></div>
                    <div id="extractProgressText" class="progress-text">STANDBY 0%</div>
                 </div>`,
                []
            );
            $('#popupButtons').hide();
        }

        function promptForPdfPassword(fileName, isRetry = false) {
            return new Promise((resolve) => {
                $('#popupOverlay, #customPopup').stop(true, true);
                $('#popupOverlay').css('pointer-events', 'none');
                $('#popupButtons').show();

                const errorHtml = isRetry
                    ? `<p style="color:var(--nier-error-red); font-size:12px; font-weight:700; text-align:center; margin-bottom:10px;">Incorrect password. Please try again.</p>`
                    : '';

                showPopup(
                    "PASSWORD REQUIRED",
                    `<p style="text-align:center; margin-bottom:10px;">Document <b>${fileName}</b> is protected by a password.</p>
                     ${errorHtml}
                     <div class="nier-form-group" style="margin-bottom:4px;">
                        <label class="nier-form-label">Enter Document Password</label>
                        <div class="nier-password-wrapper">
                            <input type="password" id="unlockPdfPwdInput" class="nier-input" placeholder="Password...">
                            <button type="button" id="toggleUnlockPwdEye" class="nier-pwd-eye" title="Show / Hide Password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                     </div>`,
                    [
                        {
                            text: "UNLOCK",
                            id: "confirmUnlockPdfBtn",
                            action: function() {
                                const val = $('#unlockPdfPwdInput').val();
                                if (!val) {
                                    $('#unlockPdfPwdInput').focus();
                                    return;
                                }
                                actionSound.currentTime = 0; actionSound.play();
                                resolve(val);
                            }
                        },
                        {
                            text: "SKIP FILE",
                            action: function() {
                                clickSound.currentTime = 0; clickSound.play();
                                resolve(null);
                            }
                        }
                    ]
                );

                $('#confirmUnlockPdfBtn').css({'background-color': 'var(--nier-dark)', 'color': '#d3cebb'});

                setTimeout(() => {
                    const inputEl = document.getElementById('unlockPdfPwdInput');
                    if (inputEl) {
                        inputEl.focus();
                        inputEl.addEventListener('keydown', (e) => {
                            if (e.key === 'Enter') {
                                e.preventDefault();
                                document.getElementById('confirmUnlockPdfBtn')?.click();
                            }
                        });
                    }
                }, 50);

        async function openPdfDocumentWithPrompt(file, arrayBuffer, restorePopupFn = showReadingDataPopup) {
            let password = undefined;
            let isRetry = false;

            while (true) {
                try {
                    const params = { data: new Uint8Array(arrayBuffer.slice(0)) };
                    if (password !== undefined) {
                        params.password = password;
                    }
                    const loadingTask = pdfjsLib.getDocument(params);
                    const pdfDoc = await loadingTask.promise;
                    if ((isRetry || password !== undefined) && typeof restorePopupFn === 'function') {
                        restorePopupFn();
                    }
                    return { pdfDoc, password: password || null, skipped: false };
                } catch (err) {
                    const isPasswordErr =
                        err && (
                            err.name === 'PasswordException' ||
                            err.code === 1 ||
                            err.code === 2 ||
                            /password/i.test(err.message || '')
                        );

                    if (isPasswordErr) {
                        const userPwd = await promptForPdfPassword(file.name, isRetry);
                        if (userPwd === null) {
                            if (typeof restorePopupFn === 'function') restorePopupFn();
                            return { pdfDoc: null, password: null, skipped: true };
                        }
                        password = userPwd;
                        isRetry = true;
                    } else {
                        throw err;
                    }
                }
            }
        }

        // --- IMPORT TỪ URL (HỖ TRỢ NHIỀU URL MỖI DÒNG, PROGRESS BAR TỪNG URL & BÁO LỖI CHI TIẾT) ---
        function isBufferPdf(arrayBuffer) {
            if (!arrayBuffer || arrayBuffer.byteLength < 5) return false;
            const bytes = new Uint8Array(arrayBuffer, 0, Math.min(arrayBuffer.byteLength, 1024));
            const headerStr = String.fromCharCode.apply(null, bytes);
            return headerStr.includes('%PDF-');
        }

        function verifyImageBlobUrl(blobUrl) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => resolve(false);
                img.src = blobUrl;
            });
        }

        function extractFileNameFromUrl(urlStr, index, isPdf) {
            try {
                const u = new URL(urlStr);
                let pathname = decodeURIComponent(u.pathname || '');
                if (pathname.endsWith('/')) pathname = pathname.slice(0, -1);
                let name = pathname.split('/').pop() || '';
                name = name.replace(/[<>:"/\\|?*]+/g, '_').trim();
                if (!name) name = `URL_${isPdf ? 'Doc' : 'Image'}_${index + 1}`;
                if (isPdf && !name.toLowerCase().endsWith('.pdf')) {
                    name += '.pdf';
                } else if (!isPdf && !/\.(jpe?g|png|webp|gif|bmp)$/i.test(name)) {
                    name += '.jpg';
                }
                return name;
            } catch (_) {
                return `URL_${isPdf ? 'Doc' : 'Image'}_${index + 1}${isPdf ? '.pdf' : '.jpg'}`;
            }
        }

        async function readResponseBufferWithProgress(response, onProgress, labelPrefix = 'DOWNLOADING') {
            const contentLength = parseInt(response.headers.get('content-length') || '0', 10);
            if (response.body && typeof response.body.getReader === 'function') {
                const reader = response.body.getReader();
                const chunks = [];
                let receivedLength = 0;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    if (value) {
                        chunks.push(value);
                        receivedLength += value.byteLength;
                        if (contentLength > 0) {
                            const pct = Math.min(82, Math.max(12, Math.round((receivedLength / contentLength) * 82)));
                            onProgress(pct, `${labelPrefix} ${pct}% (${(receivedLength / 1024).toFixed(0)} KB)`);
                        } else {
                            onProgress(55, `${labelPrefix} ${(receivedLength / 1024).toFixed(0)} KB...`);
                        }
                    }
                }

                const combined = new Uint8Array(receivedLength);
                let pos = 0;
                for (const chunk of chunks) {
                    combined.set(chunk, pos);
                    pos += chunk.byteLength;
                }
                return combined.buffer;
            } else {
                onProgress(60, `${labelPrefix}...`);
                return await response.arrayBuffer();
            }
        }

        async function fetchUrlWithProgress(rawUrl, onProgress) {
            let lastError = null;

            // Tầng 1: Tải trực tiếp từ trình duyệt (nếu server đích mở CORS)
            try {
                const directResp = await fetch(rawUrl, { mode: 'cors', credentials: 'omit' });
                if (!directResp.ok) {
                    throw new Error(`HTTP ${directResp.status}`);
                }
                const contentType = (directResp.headers.get('content-type') || '').toLowerCase();
                const buffer = await readResponseBufferWithProgress(directResp, onProgress, 'DOWNLOADING');
                if (buffer && buffer.byteLength > 0) {
                    return { buffer, contentType };
                }
            } catch (err) {
                lastError = err;
            }

            // Tầng 2: Reroute qua Core Server Webhook (Bypass CORS 100% cho cả PDF nặng và ảnh, giải nén ZIP trên RAM)
            try {
                onProgress(18, 'REROUTING TO CORE SERVER...');
                const coreResp = await fetch('https://interdata.kurotheblackbear.io.vn/webhook/bulk-image-downloader', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        files: [{ url: rawUrl, filename: 'resource.bin' }],
                        folder_name: 'temp'
                    })
                });

                if (!coreResp.ok) {
                    throw new Error(`Core Relay HTTP ${coreResp.status}`);
                }

                const zipBuffer = await readResponseBufferWithProgress(coreResp, onProgress, 'CORE STREAM');
                onProgress(84, 'UNPACKING STREAM...');

                const zip = await JSZip.loadAsync(zipBuffer);
                const fileKeys = Object.keys(zip.files).filter(k => !zip.files[k].dir);
                if (fileKeys.length === 0) {
                    throw new Error('Remote server rejected download or file not found (404/403)');
                }

                const rawFileBuffer = await zip.files[fileKeys[0]].async('arraybuffer');
                if (!rawFileBuffer || rawFileBuffer.byteLength === 0) {
                    throw new Error('Extracted file is empty');
                }

                const inferredType = isBufferPdf(rawFileBuffer) ? 'application/pdf' : '';
                return { buffer: rawFileBuffer, contentType: inferredType };
            } catch (err) {
                lastError = err;
            }

            // Tầng 3: Fallback qua WSRV CDN Proxy (cho ảnh hoặc khi Core Server bảo trì)
            try {
                onProgress(30, 'TRYING CDN PROXY...');
                const proxyResp = await fetch(`https://wsrv.nl/?url=${encodeURIComponent(rawUrl)}`);
                if (!proxyResp.ok) {
                    throw new Error(`Proxy HTTP ${proxyResp.status}`);
                }
                const contentType = (proxyResp.headers.get('content-type') || '').toLowerCase();
                const buffer = await readResponseBufferWithProgress(proxyResp, onProgress, 'PROXY STREAM');
                if (buffer && buffer.byteLength > 0) {
                    return { buffer, contentType };
                }
            } catch (err) {
                if (!lastError) lastError = err;
            }

            throw lastError || new Error('Failed to fetch resource (CORS / Network blocked)');
        }

        document.getElementById('urlImportBtn').addEventListener('click', async () => {

            function renderUrlImportPopupState(finished = false, failedItems = [], importedCount = 0) {

                            </div>
                        </div>

                }).join('');

                let errorSummaryHtml = '';

                    `<p style="text-align:center; margin-bottom:8px; font-size:12px;">
                        ${finished ? `Processed ${urlStates.length} URL(s).` : `Fetching and parsing ${urlStates.length} remote resource(s)...`}
                     </p>
                     <div class="url-progress-list" id="urlProgressListContainer">${listHtml}</div>
                     ${errorSummaryHtml}`,
                    finished
                        ? [{ text: "CLOSE", action: function() { clickSound.currentTime = 0; clickSound.play(); closePopup(false); } }]
                        : []
                );

                if (finished) {
                    $('#popupButtons').show();
                } else {
                    $('#popupButtons').hide();

            function updateSingleUrlRow(idx, patch) {
                const st = urlStates[idx];
                Object.assign(st, patch);
                const statusEl = document.getElementById(`urlProgStatus_${idx}`);
                const barEl = document.getElementById(`urlProgBar_${idx}`);
                const textEl = document.getElementById(`urlProgText_${idx}`);
                const itemEl = document.getElementById(`urlProgItem_${idx}`);

                if (statusEl) {
                    statusEl.textContent = st.statusText;
                    statusEl.className = 'url-progress-status ' + (st.statusClass || '');
                }
                if (barEl) {
                    barEl.style.width = st.percent + '%';
                    if (st.isError) barEl.style.background = 'var(--nier-error-red)';
                }
                if (textEl) {
                    textEl.textContent = st.barText;
                }
                if (itemEl) {
                    itemEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }

            renderUrlImportPopupState(false);

            const newItems = [];
            let successUrlCount = 0;

            for (let i = 0; i < urlStates.length; i++) {
                const rawUrl = urlStates[i].url;

                // Kiểm tra định dạng URL hợp lệ
                let parsedUrl = null;
                try {
                    parsedUrl = new URL(rawUrl);
                    if (parsedUrl.protocol !== 'http:' && parsedUrl.protocol !== 'https:') {
                        throw new Error('Protocol must be HTTP/HTTPS');
                    }
                } catch (_) {
                    updateSingleUrlRow(i, {
                        statusText: 'INVALID URL',
                        statusClass: 'status-err',
                        percent: 100,
                        barText: 'FAILED (SYNTAX ERROR)',
                        isError: true,
                        errorReason: 'Invalid URL syntax (must start with http:// or https://)'
                    });
                    continue;
                }

                updateSingleUrlRow(i, {
                    statusText: 'CONNECTING',
                    percent: 8,
                    barText: 'CONNECTING...'
                });

                try {
                    const { buffer, contentType } = await fetchUrlWithProgress(rawUrl, (pct, txt) => {
                        updateSingleUrlRow(i, {
                            statusText: 'DOWNLOADING',
                            percent: pct,
                            barText: txt
                        });
                    });

                    if (!buffer || buffer.byteLength === 0) {
                        throw new Error('Empty response received');
                    }

                    const isPdf = isBufferPdf(buffer) || contentType.includes('application/pdf');

                    if (isPdf && isBufferPdf(buffer)) {
                        const fileName = extractFileNameFromUrl(rawUrl, i, true);
                        const baseName = getBaseFileName(fileName);

                        updateSingleUrlRow(i, {
                            statusText: 'PARSING PDF',
                            percent: 88,
                            barText: 'OPENING PDF...'
                        });

                        const { pdfDoc, password, skipped } = await openPdfDocumentWithPrompt(

                        );

                        if (skipped || !pdfDoc) {
                            updateSingleUrlRow(i, {
                                statusText: 'SKIPPED',
                                statusClass: 'status-err',
                                percent: 100,
                                barText: 'SKIPPED (LOCKED)',
                                isError: true,
                                errorReason: 'Password-protected PDF was skipped by user'
                            });

                        }

                        const pdfId = 'pdf_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                        pdfBuffersMap.set(pdfId, buffer.slice(0));
                        if (password) {
                            pdfPasswordsMap.set(pdfId, password);
                        }

                        const numPages = pdfDoc.numPages;
                        for (let p = 1; p <= numPages; p++) {
                            const pagePct = 88 + Math.round((p / numPages) * 12);
                            updateSingleUrlRow(i, {
                                statusText: `PAGE ${p}/${numPages}`,
                                percent: pagePct,
                                barText: `SPLITTING ${p} / ${numPages}`
                            });

                            const page = await pdfDoc.getPage(p);
                            const previewUrl = await renderPdfPageToBlobUrl(page);

                            newItems.push({
                                id: 'page_' + Date.now() + '_' + p + '_' + Math.random().toString(36).substr(2, 7),
                                type: 'pdf-page',
                                pdfId: pdfId,
                                pageIndex: p - 1,
                                pageNumber: p,
                                name: `${baseName} - Page ${p}`,
                                baseFileName: baseName,
                                originalDataUrl: previewUrl,
                                dataUrl: previewUrl,
                                rotation: 0,
                                annotations: [],
                                checked: true
                            });
                        }

                        successUrlCount++;
                        updateSingleUrlRow(i, {
                            statusText: 'DONE',
                            statusClass: 'status-ok',
                            percent: 100,
                            barText: `IMPORTED (${numPages} PAGE${numPages > 1 ? 'S' : ''})`
                        });
                    } else {
                        // Kiểm tra xem có phải là file ảnh hợp lệ không
                        const mime = contentType.startsWith('image/') ? contentType.split(';')[0] : 'image/jpeg';
                        const imgBlob = new Blob([buffer], { type: mime });
                        const objUrl = URL.createObjectURL(imgBlob);
                        const isValidImg = await verifyImageBlobUrl(objUrl);

                        if (!isValidImg) {
                            URL.revokeObjectURL(objUrl);
                            throw new Error('URL does not point to a valid PDF or Image file');
                        }

                        const fileName = extractFileNameFromUrl(rawUrl, i, false);
                        const baseName = getBaseFileName(fileName);

                        newItems.push({
                            id: 'img_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
                            type: 'image',
                            name: fileName,
                            baseFileName: baseName,
                            originalDataUrl: objUrl,
                            dataUrl: objUrl,
                            rotation: 0,
                            annotations: [],
                            checked: true
                        });

                        successUrlCount++;
                        updateSingleUrlRow(i, {
                            statusText: 'DONE',
                            statusClass: 'status-ok',
                            percent: 100,
                            barText: 'IMPORTED (IMAGE)'
                        });
                    }
                } catch (err) {
                    console.error('URL Import Error:', rawUrl, err);
                    updateSingleUrlRow(i, {
                        statusText: 'FAILED',
                        statusClass: 'status-err',
                        percent: 100,
                        barText: 'IMPORT FAILED',
                        isError: true,
                        errorReason: err && err.message ? err.message : 'Unable to fetch or decode resource'
                    });
                }
            }

            if (newItems.length > 0) {
                uploadedFiles = uploadedFiles.concat(newItems);
                renderThumbnails(newItems);
                if (watermarkConfig.enabled || pageNumberConfig.enabled) {
                    await refreshAllPagesComposited();

                textarea.value = failedItems.map(f => f.url).join('\n');
                deleteSound.currentTime = 0; deleteSound.play();
                renderUrlImportPopupState(true, failedItems, successUrlCount);
            }

        async function handleFiles(files) {
            const validFiles = Array.from(files).filter(f => isImageFile(f) || isPdfFile(f));
            if (validFiles.length === 0) return;

            const hasPdf = validFiles.some(f => isPdfFile(f));
            if (hasPdf) {
                showReadingDataPopup();
            }

            const newItems = [];
            let failedCount = 0;

            try {
                for (let fIdx = 0; fIdx < validFiles.length; fIdx++) {
                    const file = validFiles[fIdx];
                    const baseName = getBaseFileName(file.name);

                    if (isImageFile(file)) {
                        const objUrl = URL.createObjectURL(file);
                        newItems.push({
                            id: 'img_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
                            type: 'image',
                            name: file.name,
                            baseFileName: baseName,
                            originalDataUrl: objUrl,
                            dataUrl: objUrl,
                            rotation: 0,
                            annotations: [],
                            checked: true
                        });
                    } else if (isPdfFile(file)) {
                        try {
                            const arrayBuffer = await file.arrayBuffer();
                            const { pdfDoc, password, skipped } = await openPdfDocumentWithPrompt(file, arrayBuffer);
                            if (skipped || !pdfDoc) continue;

                            const pdfId = 'pdf_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                            pdfBuffersMap.set(pdfId, arrayBuffer.slice(0));
                            if (password) {
                                pdfPasswordsMap.set(pdfId, password);
                            }

                            const numPages = pdfDoc.numPages;

                            for (let p = 1; p <= numPages; p++) {
                                const statusEl = document.getElementById('extractStatusText');
                                const barEl = document.getElementById('extractProgressBar');
                                const textEl = document.getElementById('extractProgressText');
                                if (statusEl) statusEl.textContent = `Splitting: ${file.name} (Page ${p}/${numPages})`;
                                if (barEl && textEl) {
                                    const pagePct = Math.round((p / numPages) * 100);
                                    barEl.style.width = pagePct + '%';
                                    textEl.textContent = `PAGE ${p} / ${numPages} (${pagePct}%)`;
                                }

                                const page = await pdfDoc.getPage(p);
                                const previewUrl = await renderPdfPageToBlobUrl(page);

                                newItems.push({
                                    id: 'page_' + Date.now() + '_' + p + '_' + Math.random().toString(36).substr(2, 7),
                                    type: 'pdf-page',
                                    pdfId: pdfId,
                                    pageIndex: p - 1,
                                    pageNumber: p,
                                    name: `${baseName} - Page ${p}`,
                                    baseFileName: baseName,
                                    originalDataUrl: previewUrl,
                                    dataUrl: previewUrl,
                                    rotation: 0,
                                    annotations: [],
                                    checked: true
                                });
                            }
                        } catch (err) {
                            console.error("Failed to parse PDF:", file.name, err);
                            failedCount++;
                        }
                    }
                }
            } finally {
                if (newItems.length > 0) {
                    uploadedFiles = uploadedFiles.concat(newItems);
                    renderThumbnails(newItems);
                    if (watermarkConfig.enabled || pageNumberConfig.enabled) {
                        await refreshAllPagesComposited();
                    }
                    updateToolbarStatus();
                }

                if (hasPdf) {
                    $('#popupOverlay').css('pointer-events', 'auto');
                    $('#popupButtons').show();
                    if (failedCount > 0) {
                        showPopup("SYSTEM ALERT", `<p style="text-align:center;">Failed to read ${failedCount} PDF file(s). Please ensure the file is not corrupted.</p>`);
                    } else {
                        $('#popupOverlay, #customPopup').stop(true, true).fadeOut(200);
                    }
                }
            }
        }

        function cleanupUnusedPdfBuffer(pdfId) {
            if (!pdfId) return;

        function revokeItemUrls(item) {
            if (item.dataUrl && item.dataUrl !== item.originalDataUrl && item.dataUrl.startsWith('blob:')) {
                URL.revokeObjectURL(item.dataUrl);

            if (item.originalDataUrl && item.originalDataUrl.startsWith('blob:')) {
                URL.revokeObjectURL(item.originalDataUrl);
            }
        }
